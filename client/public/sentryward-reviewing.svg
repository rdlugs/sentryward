<svg xmlns="http://www.w3.org/2000/svg" width="360" height="48" viewBox="0 0 360 48" role="img" aria-label="Review in progress">
  <style>
    .ring-track { fill: none; stroke: #e5e5e5; stroke-width: 2.5; }
    .ring { fill: none; stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; transform-origin: 14px 18px; animation: spin 0.9s linear infinite; }
    .label { fill: #262626; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .dot { fill: #3b82f6; animation: pulse 1.2s ease-in-out infinite; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.4s; }
    .track { fill: #e5e5e5; }
    .glow { stop-color: #3b82f6; }
    .bar { animation: slide 1.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes slide { from { transform: translateX(-140px); } to { transform: translateX(360px); } }
    @media (prefers-color-scheme: dark) {
      .ring-track { stroke: #404040; }
      .track { fill: #404040; }
      .ring { stroke: #60a5fa; }
      .dot { fill: #60a5fa; }
      .label { fill: #e5e5e5; }
      .glow { stop-color: #60a5fa; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring, .dot, .bar { animation: none; }
      .dot { opacity: 1; }
      .bar { transform: translateX(110px); }
    }
  </style>
  <defs>
    <linearGradient id="g">
      <stop offset="0" class="glow" stop-opacity="0"/>
      <stop offset="0.5" class="glow"/>
      <stop offset="1" class="glow" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect y="40" width="360" height="4" rx="2"/></clipPath>
  </defs>
  <circle class="ring-track" cx="14" cy="18" r="9"/>
  <path class="ring" d="M14 9 A9 9 0 0 1 23 18"/>
  <text class="label" x="32" y="23">Reviewing changes</text>
  <circle class="dot" cx="171" cy="19" r="2"/>
  <circle class="dot d2" cx="179" cy="19" r="2"/>
  <circle class="dot d3" cx="187" cy="19" r="2"/>
  <g clip-path="url(#c)">
    <rect class="track" y="40" width="360" height="4"/>
    <rect class="bar" y="40" width="140" height="4" fill="url(#g)"/>
  </g>
</svg>
